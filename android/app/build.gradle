plugins { id 'com.android.application' }
android {
    namespace 'app.quire.sketchbook'
    compileSdk 34
    defaultConfig {
        applicationId 'app.quire.sketchbook'
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName '1.5.2'
    }
    // Pin the standard debug key to a file in the repo, so every CI build is signed the same way and installs over the last one.
    signingConfigs { debug { storeFile rootProject.file('debug.keystore') } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
