name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copy the web app into the APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html manifest.webmanifest android/app/src/main/assets/www/
          cp *.png android/app/src/main/assets/www/ || true
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publish the APK to the apk-bin branch
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk /tmp/Quire.apk
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan apk-bin
          git rm -rfq .
          cp /tmp/Quire.apk Quire.apk
          git add Quire.apk
          git commit -qm "Quire APK from ${GITHUB_SHA::7}"
          git push -f origin apk-bin
      - uses: actions/upload-artifact@v4
        with: { name: Quire-apk, path: /tmp/Quire.apk }
